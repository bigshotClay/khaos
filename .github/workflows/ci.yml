name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Mesa Lavapipe + Vulkan validation layers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers libvulkan1

      - name: Log Mesa and validation layer versions
        run: |
          dpkg -l mesa-vulkan-drivers vulkan-validationlayers | grep '^ii'

      - name: Log available Vulkan ICD paths
        run: ls /usr/share/vulkan/icd.d/

      - name: Set Lavapipe ICD
        # Mesa ships this as lvp_icd.json on Ubuntu 24.04 and as lvp_icd.<arch>.json
        # elsewhere, so match both. Resolve before writing to GITHUB_ENV: inside a
        # command substitution a failed glob is silent, which would export an empty
        # VK_ICD_FILENAMES and leave the tests running against the wrong driver.
        run: |
          set -euo pipefail
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Using Lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Run tests
        # 'check', not 'test': khaos-core is a Kotlin Multiplatform module whose test task is
        # named jvmTest, so './gradlew test' would silently skip it and only run the JVM
        # modules. 'check' is present in every module and depends on whichever test task exists.
        run: ./gradlew check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: jacoco-report
          # Per-module now that the build is multi-module; the root project produces no reports.
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore
