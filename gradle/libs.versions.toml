[versions]
kotlin        = "2.3.20"
ksp           = "2.3.6"
kotest        = "5.9.1"
lwjgl         = "3.3.6"
kctfork       = "0.7.1"

[libraries]
# ── LWJGL ─────────────────────────────────────────────────────
# BOM manages versions for all LWJGL artifacts.
# Native classifier variants (natives-linux, natives-macos-arm64, natives-windows, etc.)
# are NOT expressible in TOML (Gradle 9.x does not support `classifier =` in catalog entries).
# Declare natives inline at the module level using one of:
#   variantOf(libs.lwjgl.core) { classifier("natives-linux") }
#   "org.lwjgl:lwjgl::natives-linux"
#   "org.lwjgl:lwjgl::natives-macos-arm64"
#   "org.lwjgl:lwjgl-vulkan::natives-macos"   (macOS only — Linux/Windows use system ICD)
# See D6 in planning/designs/issue-3-design.md for the full native strategy.
lwjgl-bom     = { module = "org.lwjgl:lwjgl-bom",     version.ref = "lwjgl" }
lwjgl-core    = { module = "org.lwjgl:lwjgl" }
lwjgl-vulkan  = { module = "org.lwjgl:lwjgl-vulkan" }
lwjgl-shaderc = { module = "org.lwjgl:lwjgl-shaderc" }

# ── Kotest ────────────────────────────────────────────────────
kotest-runner-junit5    = { module = "io.kotest:kotest-runner-junit5",   version.ref = "kotest" }
kotest-assertions-core  = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property         = { module = "io.kotest:kotest-property",        version.ref = "kotest" }

# ── Compile-testing ───────────────────────────────────────────
# Drives the negative type-safety tests: asserts that mismatching handle types
# fails to compile, which is the whole point of the VK-2 typed handle layer.
kctfork-core            = { module = "dev.zacsweers.kctfork:core",       version.ref = "kctfork" }
# kctfork 0.7.1 (its latest) pins kotlin-compiler-embeddable 2.1.10, which reads class metadata
# only up to version 2.2.0. Our own classes are compiled at Kotlin 2.3.20 (metadata 2.3.0), so the
# embedded compiler cannot load them — every negative test would still see COMPILATION_ERROR, but
# from a metadata mismatch rather than the type error it is meant to prove. Forcing the compiler to
# the project's Kotlin version keeps those assertions meaningful.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
